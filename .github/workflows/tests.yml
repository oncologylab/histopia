name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native WSI dependency
        run: sudo apt-get update && sudo apt-get install --yes libvips

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[dev,registration,semantic,stain,wsi]"

      - name: Run Ruff
        run: python -m ruff check . && python -m ruff format --check .

      - name: Run pytest
        run: python -m pytest

  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and browser
        run: |
          python -m pip install -e ".[browser-test,registration,semantic,stain,wsi]"
          python -m playwright install --with-deps chromium

      - name: Run browser checks
        run: python -m pytest -m browser

  reproducible-profiles:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native WSI dependency
        run: sudo apt-get update && sudo apt-get install --yes libvips

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install exact CPU workflow profiles
        run: >-
          python -m pip install -e
          ".[dev,registration-repro,semantic-repro,stain-repro,qupath]"

      - name: Verify exact versions and workflow contracts
        env:
          HISTOPIA_VERIFY_REPRO: "1"
        run: |
          python -m pytest \
            tests/test_dependency_profiles.py \
            tests/test_optional_import_boundaries.py
          histopia-qupath \
            --doctor --workflow registration --device cpu --require-api 1
          histopia-qupath \
            --doctor --workflow interchange --device cpu --require-api 1
          python -m pip check
