name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native WSI dependency
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes libvips

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install -e ".[dev,registration,semantic,topology,stain,wsi,protein,study]" \
            -c constraints/dev-repro.txt

      - name: Install CPU model-training dependency
        run: python -m pip install "torch>=2.8,<3" --index-url https://download.pytorch.org/whl/cpu

      - name: Run Ruff
        run: python -m ruff check . && python -m ruff format --check .

      - name: Run pytest
        run: python -m pytest

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native WSI dependency
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes libvips

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and browser
        run: |
          python -m pip install -e \
            ".[browser-test,registration,semantic,topology,stain,wsi]"
          python -m playwright install --with-deps chromium

      - name: Run browser checks
        run: python -m pytest -m browser

  reproducible-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install native WSI dependency
        timeout-minutes: 8
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes libvips

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install exact CPU workflow profiles
        run: |
          python -m pip install -e \
            ".[dev,registration,semantic,topology,stain,wsi,qupath]" \
            -c constraints/dev-repro.txt \
            -c constraints/registration-repro.txt \
            -c constraints/semantic-repro.txt \
            -c constraints/topology-repro.txt \
            -c constraints/stain-repro.txt

      - name: Verify exact versions and workflow contracts
        env:
          HISTOPIA_VERIFY_REPRO_CONSTRAINTS: "1"
        run: |
          python -m pytest \
            tests/test_dependency_profiles.py \
            tests/test_optional_import_boundaries.py
          histopia-qupath \
            --doctor --workflow registration --device cpu --require-api 2
          histopia-qupath \
            --doctor --workflow interchange --device cpu --require-api 2
          histopia-qupath \
            --doctor --workflow topology --device cpu --require-api 2
          python -m pip check
