<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Histopia · Tissue review</title><link rel="stylesheet" href="catalog.css"></head>
<body><header><h1>Tissue review</h1><span id="updated"></span></header>
<main id="app" hidden><div class="source-bar"><nav id="sources" aria-label="Data source"></nav><label class="mobile-source" for="source-select">Data source<select id="source-select"></select></label></div><nav id="organs" aria-label="Organ"></nav>
<div class="selection-bar"><label for="subject">Specimen<select id="subject"></select></label><label id="reconstruction-label" for="reconstruction" hidden>Block<select id="reconstruction"></select></label><label id="section-label" for="section">Section<select id="section"></select></label><label for="stage">Analysis<select id="stage"><option value="">All analyses</option></select></label><label for="collection">Browse<select id="collection"><option value="specimens">Tissue &amp; sections</option><option value="summaries">Cohort &amp; inventory</option></select></label></div>
<div class="workspace"><aside><details id="browse" open><summary><span id="list-title">Evidence</span> <span id="count"></span></summary><div id="datasets" aria-label="Datasets"></div></details></aside>
<p id="empty" hidden>No results are available for this source and organ yet.</p>
<article id="detail" hidden><div class="detail-heading"><div><p id="identity" class="eyebrow"></p><h2 id="title"></h2></div><span id="status" class="badge"></span></div>
<iframe id="stack-preview" title="Observed serial tissue reconstruction" hidden></iframe>
<section id="evidence" hidden><div class="image-toolbar"><button id="previous" aria-label="Previous field">←</button><select id="field" aria-label="Evidence field"></select><button id="next" aria-label="Next field">→</button><button id="native" aria-pressed="false">Native size</button><a id="open-image" target="_blank" rel="noopener">Open image</a></div><div id="image-viewport"><img id="image" alt=""></div><p id="caption-short"></p></section>
<p id="summary"></p><dl id="facts"></dl><div id="links" class="links"></div>
<details id="methods"><summary>Methods &amp; provenance</summary><p id="full-summary"></p><p id="caption"></p><dl id="all-facts"></dl><p id="source-description"></p><p class="scope">Review candidates retain their upstream approval status.</p><code id="fingerprint"></code></details>
<details id="metrics" hidden><summary>Recorded metrics</summary><div class="table-scroll"><table id="table"></table></div></details>
<details id="notes"><summary>Review notes</summary><label for="review-state">Draft assessment</label><select id="review-state"><option value="unreviewed">Not reviewed</option><option value="needs-changes">Needs changes</option><option value="lab-review">Ready for lab review</option></select><label for="note">Notes</label><textarea id="note" rows="3" placeholder="Field, finding, uncertainty"></textarea><p id="note-state">Browser-local draft; upstream approvals stay intact.</p><button id="export-notes">Export notes</button></details></article></div>
<details id="compute"><summary>Compute <span id="compute-count"></span></summary><div id="compute-rows"></div><button id="refresh">Refresh results</button></details>
</main><noscript><main><p>Source and organ evidence</p><!-- FALLBACK --></main></noscript><script src="catalog-data.js"></script><script src="catalog.js"></script></body></html>
